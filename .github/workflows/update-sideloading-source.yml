name: Update sideloading source

on:
  release:
    types: [published, edited]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - altstore-source.json
      - Scripts/update-altstore-source.py
      - .github/workflows/update-sideloading-source.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate the AltSource from GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/update-altstore-source.py
      - name: Validate the generated source
        run: python3 Scripts/update-altstore-source.py --validate
      - name: Commit an updated source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if git diff --quiet -- altstore-source.json; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add altstore-source.json
          git commit -m "Update sideloading source for ${RELEASE_TAG:-manual run}"
          git push

  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate the checked-in source
        run: python3 Scripts/update-altstore-source.py --validate
