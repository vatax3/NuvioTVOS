name: NuvioTVOS
options:
  bundleIdPrefix: com.nuvio
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# libmpv for Apple platforms — the same engine the Android build uses, and the only practical way
# to open MKV and the other containers AVFoundation has no demuxer for. The player code is already
# in Sources/Features/Player, guarded by `#if canImport(Libmpv)`, so uncommenting this block and
# the matching dependency below is all it takes to switch the internal MPV engine on.
#
# Left out of the default build because resolving it pulls ~25 xcframeworks from 15 separate
# repositories, and that resolution did not complete in the environment this was written in — so
# the MPV path has never been compiled. Turn it on in a normal Xcode session and expect to fix
# compile errors in MPVEngine.swift before it runs.
#
# packages:
#   MPVKit:
#     url: https://github.com/mpvkit/MPVKit.git
#     exactVersion: 1.0.0

targets:
  NuvioTVOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    # dependencies:
    #   - package: MPVKit
    #     product: MPVKit
    sources:
      - path: Sources
      # Added as individual file references, not a blue folder: a directory literally
      # named "Resources" at the root of a shallow tvOS bundle makes codesign misread
      # the bundle layout and refuse to sign.
      - path: Resources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvio.tvos
        PRODUCT_NAME: Nuvio
        INFOPLIST_KEY_CFBundleDisplayName: Nuvio
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nuvio
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - inter_variable.ttf
          - dm_sans_variable.ttf
          - opensans_variable.ttf
        # Trailer hand-off: canOpenURL only answers for schemes declared here.
        LSApplicationQueriesSchemes:
          - youtube
          # External players Nuvio can hand a stream to; canOpenURL only answers for these.
          - infuse
          - vlc-x-callback
          - vlc
          - nplayer
          - outplayer
