name: NuvioTVOS
options:
  bundleIdPrefix: com.nuvio
  createIntermediateGroups: true
  deploymentTarget:
    tvOS: "17.0"
  groupSortPosition: top

schemes:
  NuvioTVOS:
    build:
      targets:
        NuvioTVOS: all
    test:
      targets:
        - NuvioTVOSTests
        - NuvioTVOSUITests

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

# libmpv for Apple platforms — the same engine the Android build uses, and the only practical way
# to open MKV and the other containers AVFoundation has no demuxer for.
#
# Vendored under Vendor/ rather than pulled through SPM: MPVKit resolves ~28 xcframeworks across
# 15 repositories, and Xcode's resolver sat on a GitHub credential prompt instead of downloading.
# These are the same release artifacts, trimmed to their tvOS slices.

targets:
  NuvioTVOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NuvioTopShelf
        embed: true
      # System frameworks the mpv/FFmpeg stack calls into: VideoToolbox for hardware decode,
      # Metal and IOSurface for MoltenVK, the audio units for output.
      - sdk: VideoToolbox.framework
      - sdk: CoreMedia.framework
      - sdk: CoreVideo.framework
      - sdk: CoreImage.framework
      - sdk: CoreAudio.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: IOSurface.framework
      - sdk: QuartzCore.framework
      - sdk: CoreGraphics.framework
      - sdk: CoreText.framework
      - sdk: OpenGLES.framework
      - sdk: GLKit.framework
      # Static xcframeworks, so they are linked but not embedded.
      - framework: Vendor/Libass.xcframework
        embed: false
      - framework: Vendor/Libavcodec.xcframework
        embed: false
      - framework: Vendor/Libavdevice.xcframework
        embed: false
      - framework: Vendor/Libavfilter.xcframework
        embed: false
      - framework: Vendor/Libavformat.xcframework
        embed: false
      - framework: Vendor/Libavutil.xcframework
        embed: false
      - framework: Vendor/Libbluray.xcframework
        embed: false
      - framework: Vendor/Libcrypto.xcframework
        embed: false
      - framework: Vendor/Libdav1d.xcframework
        embed: false
      - framework: Vendor/Libdovi.xcframework
        embed: false
      - framework: Vendor/Libfreetype.xcframework
        embed: false
      - framework: Vendor/Libfribidi.xcframework
        embed: false
      - framework: Vendor/Libharfbuzz.xcframework
        embed: false
      - framework: Vendor/Libmpv.xcframework
        embed: false
      - framework: Vendor/Libplacebo.xcframework
        embed: false
      - framework: Vendor/Libshaderc_combined.xcframework
        embed: false
      - framework: Vendor/Libssl.xcframework
        embed: false
      - framework: Vendor/Libswresample.xcframework
        embed: false
      - framework: Vendor/Libswscale.xcframework
        embed: false
      - framework: Vendor/Libuavs3d.xcframework
        embed: false
      - framework: Vendor/Libuchardet.xcframework
        embed: false
      - framework: Vendor/Libunibreak.xcframework
        embed: false
      - framework: Vendor/MoltenVK.xcframework
        embed: false
      - framework: Vendor/gmp.xcframework
        embed: false
      - framework: Vendor/gnutls.xcframework
        embed: false
      - framework: Vendor/hogweed.xcframework
        embed: false
      - framework: Vendor/lcms2.xcframework
        embed: false
      - framework: Vendor/nettle.xcframework
        embed: false
    sources:
      - path: Sources
      # Added as individual file references, not a blue folder: a directory literally
      # named "Resources" at the root of a shallow tvOS bundle makes codesign misread
      # the bundle layout and refuse to sign.
      - path: Resources
      - path: Assets.xcassets
    # Fails the build when a declared setting has no reader. This is the guard against the
    # mechanism that produced the 1.0.4 audit's finding: stores ported ahead of the features
    # meant to read them, and settings screens generated from the stores, so an inert control
    # was the default outcome rather than a mistake. See docs/FEATURE-AUDIT.md.
    preBuildScripts:
      - script: "\"$SRCROOT/Scripts/check-settings-wiring.sh\""
        name: Check settings wiring
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvio.tvos
        CODE_SIGN_ENTITLEMENTS: Sources/App/Nuvio.entitlements
        PRODUCT_NAME: Nuvio
        INFOPLIST_KEY_CFBundleDisplayName: Nuvio
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        MARKETING_VERSION: "1.0.20"
        CURRENT_PROJECT_VERSION: "22"
        TARGETED_DEVICE_FAMILY: "3"
        # MoltenVK and shaderc inside the mpv stack are C++, so the C++ runtime and the system
        # libraries they call into have to be linked explicitly.
        OTHER_LDFLAGS: "$(inherited) -lc++ -lz -lbz2 -liconv -lxml2 -lresolv"
        CLANG_CXX_LIBRARY: "libc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: Nuvio
        # Kept beside the build settings so the checked-in plist and the built app agree; the
        # About screen prints both, which is how a sideloaded build is told from the one it
        # replaced.
        CFBundleShortVersionString: "1.0.20"
        CFBundleVersion: "18"
        UIUserInterfaceStyle: Dark
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - inter_variable.ttf
          - dm_sans_variable.ttf
          - opensans_variable.ttf
        # Trailer hand-off: canOpenURL only answers for schemes declared here.
        LSApplicationQueriesSchemes:
          - youtube
          # External players Nuvio can hand a stream to; canOpenURL only answers for these.
          - infuse
          - vlc-x-callback
          - vlc
          - nplayer
          - outplayer
        CFBundleURLTypes:
          - CFBundleTypeRole: Viewer
            CFBundleURLName: com.nuvio.tvos
            CFBundleURLSchemes:
              - nuvio

  NuvioTopShelf:
    type: tv-app-extension
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - sdk: TVServices.framework
    sources:
      - path: TopShelf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvio.tvos.topshelf
        PRODUCT_NAME: NuvioTopShelf
        CODE_SIGN_ENTITLEMENTS: TopShelf/NuvioTopShelf.entitlements
        MARKETING_VERSION: "1.0.20"
        CURRENT_PROJECT_VERSION: "22"
        GENERATE_INFOPLIST_FILE: YES
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundleShortVersionString: "1.0.20"
        CFBundleVersion: "18"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NuvioTopShelfProvider

  # The player's remote handling only exists at runtime — whether a press reaches the transport
  # depends on where tvOS put focus — so it is checked by driving an actual Siri Remote through
  # XCUIRemote rather than by reasoning about the view.
  NuvioTVOSUITests:
    type: bundle.ui-testing
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NuvioTVOS
    sources:
      - path: UITests
    settings:
      base:
        TEST_TARGET_NAME: NuvioTVOS
        PRODUCT_BUNDLE_IDENTIFIER: com.nuvio.tvos.uitests
        GENERATE_INFOPLIST_FILE: YES

  NuvioTVOSTests:
    type: bundle.unit-test
    platform: tvOS
    deploymentTarget: "17.0"
    dependencies:
      - target: NuvioTVOS
    sources:
      - path: Tests
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nuvio.app/Nuvio"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
